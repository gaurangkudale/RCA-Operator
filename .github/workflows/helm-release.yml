name: Release Helm Charts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  HELM_VERSION: "v3.17.3"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Get chart version
        id: chart_version
        run: |
          VERSION=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Chart version: $VERSION"

      - name: Add Helm repositories
        run: |
          helm repo add opentelemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add jaegertracing https://jaegertracing.github.io/helm-charts
          helm repo update
          echo "✓ Helm repositories added and updated"

      - name: Update Helm dependencies
        run: |
          helm dep update helm/
          echo "✓ Helm dependencies resolved"
          echo "--- Dependency list ---"
          helm dep list helm/

      - name: Lint before packaging
        run: |
          helm lint helm/ --strict
          echo "✓ Pre-package lint passed"

      - name: Package Helm chart
        run: |
          helm package helm/ -d .
          echo "✓ Helm chart packaged"
          ls -lh rca-operator-*.tgz

      - name: Verify package contents
        run: |
          PACKAGE=$(ls rca-operator-*.tgz)
          helm show chart "$PACKAGE"
          echo "--- Packaged sub-charts ---"
          tar -tzf "$PACKAGE" | grep "charts/" | head -20
          echo "✓ Package verification passed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: helm-v${{ steps.chart_version.outputs.version }}
          name: Helm Chart v${{ steps.chart_version.outputs.version }}
          make_latest: false
          body: |
            ## Helm Chart Release v${{ steps.chart_version.outputs.version }}

            ### Included Sub-Charts
            | Chart | Version |
            |-------|---------|
            | opentelemetry-operator | 0.148.0 |
            | jaeger | 2.17.0 |

            ### Install via Helm repository (recommended)
            ```bash
            helm repo add rca-operator https://gaurangkudale.github.io/rca-operator.github.io/charts
            helm repo update
            helm install rca-operator rca-operator/rca-operator \
              --namespace rca-system --create-namespace
            ```

            ### Install directly from this release
            ```bash
            helm install rca-operator \
              https://github.com/${{ github.repository }}/releases/download/helm-v${{ steps.chart_version.outputs.version }}/rca-operator-${{ steps.chart_version.outputs.version }}.tgz \
              --namespace rca-system --create-namespace
            ```

            ### Install with observability stack disabled
            ```bash
            helm install rca-operator rca-operator/rca-operator \
              --namespace rca-system --create-namespace \
              --set opentelemetryOperator.enabled=false \
              --set jaeger.enabled=false \
              --set otelCollector.enabled=false \
              --set instrumentation.enabled=false
            ```
          files: |
            rca-operator-*.tgz
          fail_on_unmatched_files: true
