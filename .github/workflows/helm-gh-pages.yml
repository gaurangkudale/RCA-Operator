name: Publish Helm Charts to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  HELM_VERSION: "v3.17.3"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Get chart version
        id: chart_version
        run: |
          VERSION=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Chart version: $VERSION"

      - name: Add Helm repositories
        run: |
          helm repo add opentelemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add jaegertracing https://jaegertracing.github.io/helm-charts
          helm repo update
          echo "✓ Helm repositories added and updated"

      - name: Update Helm dependencies
        run: |
          helm dep update helm/
          echo "✓ Helm dependencies resolved"
          echo "--- Dependency list ---"
          helm dep list helm/

      - name: Lint before packaging
        run: |
          helm lint helm/ --strict
          echo "✓ Pre-package lint passed"

      - name: Package Helm chart
        run: |
          helm package helm/ -d /tmp/charts
          echo "✓ Helm chart packaged"
          ls -lh /tmp/charts/

      - name: Verify package contents
        run: |
          PACKAGE=$(ls /tmp/charts/rca-operator-*.tgz)
          echo "--- Packaged sub-charts ---"
          tar -tzf "$PACKAGE" | grep "charts/" | head -20
          echo "✓ Package includes sub-chart dependencies"

      - name: Checkout GitHub Pages repository
        uses: actions/checkout@v4
        with:
          repository: gaurangkudale/rca-operator.github.io
          token: ${{ secrets.PAGES_TOKEN }}
          path: gh-pages
          fetch-depth: 0

      - name: Update Helm repository index
        run: |
          # Create charts directory if it doesn't exist
          mkdir -p gh-pages/charts

          # Copy new chart package
          cp /tmp/charts/*.tgz gh-pages/charts/

          # Update Helm repository index
          cd gh-pages

          # Merge with existing index to preserve previous chart versions
          if [ -f index.yaml ]; then
            helm repo index charts \
              --url https://gaurangkudale.github.io/rca-operator.github.io/charts \
              --merge index.yaml
            echo "✓ Merged with existing index.yaml"
          else
            helm repo index charts \
              --url https://gaurangkudale.github.io/rca-operator.github.io/charts
            echo "✓ Created new index.yaml"
          fi

          # Move index to root for easier access
          cp charts/index.yaml index.yaml

          echo "--- Published chart versions ---"
          grep -E "^  - |version:" gh-pages/index.yaml | head -30

      - name: Commit and push to GitHub Pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --stat
          git commit -m "chore: publish Helm chart v${{ steps.chart_version.outputs.version }}" \
            || echo "No changes to commit"
          git push
