apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rca-operator.fullname" . }}-controller-manager
  namespace: {{ include "rca-operator.namespace" . }}
  labels:
    {{- include "rca-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rca-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rca-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rca-operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          command:
            - /manager
          args:
            {{- toYaml .Values.manager.args | nindent 12 }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.service.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            # Explicitly set both true and false so the chart value is
            # authoritative regardless of the operator binary's default.
            - --enable-webhooks={{ ternary "true" "false" .Values.webhooks.enabled }}
            {{- if .Values.leaderElection.namespace }}
            - --leader-election-namespace={{ .Values.leaderElection.namespace }}
            {{- end }}
            - --signal-buffer-size={{ .Values.signals.bufferSize }}
            - --signal-emit-dedup-window={{ .Values.signals.emitDedupWindow }}
            {{- if .Values.autoDetect.enabled }}
            - --enable-autodetect=true
            - --autodetect-min-occurrences={{ .Values.autoDetect.minOccurrences }}
            - --autodetect-max-rules={{ .Values.autoDetect.maxRules }}
            - --autodetect-interval={{ .Values.autoDetect.interval }}
            - --autodetect-expiry={{ .Values.autoDetect.expiry }}
            {{- end }}
            {{- if .Values.rcaIngest.enabled }}
            - --otel-ingest-bind-address=:{{ .Values.rcaIngest.bindPort }}
            - --otel-ingest-filter-error-status={{ .Values.otelIngest.filters.traces.statusCodeERROR }}
            - --otel-ingest-filter-http-status-gte={{ .Values.otelIngest.filters.traces.httpStatusGte }}
            - --otel-ingest-filter-latency-ms={{ .Values.otelIngest.filters.traces.latencyP99Ms }}
            - --otel-ingest-filter-min-log-severity={{ .Values.otelIngest.filters.logs.minSeverity }}
            - --otel-ingest-max-log-signals-per-request={{ .Values.otelIngest.filters.logs.maxSignalsPerRequest }}
            {{- end }}
            {{- with include "rca-operator.jaegerQueryURL" . }}
            - --jaeger-query-url={{ . }}
            {{- end }}
            {{- $selfTelemetryEndpoint := include "rca-operator.selfTelemetryEndpoint" . }}
            {{- if $selfTelemetryEndpoint }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $selfTelemetryEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            - name: OTEL_SAMPLING_RATE
              value: {{ .Values.otel.samplingRate | quote }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ .Values.otel.insecure | quote }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.dashboard.enabled }}
            - name: dashboard
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.service.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.rcaIngest.enabled }}
            - name: otel-ingest
              containerPort: {{ .Values.rcaIngest.bindPort }}
              protocol: TCP
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
