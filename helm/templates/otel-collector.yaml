{{- if and .Values.otelCollector.enabled .Values.opentelemetryOperator.enabled }}
# OpenTelemetryCollector CR — reconciled by the OpenTelemetry Operator.
#
# ┌─ HOOK RATIONALE ──────────────────────────────────────────────────────────┐
# │ This CR is a Helm post-install/post-upgrade hook so it is applied AFTER   │
# │ the otel-operator Deployment is Ready and its admission webhook is        │
# │ serving. Applying it as a regular template races with the operator         │
# │ startup and causes "no endpoints available for service" webhook errors.   │
# │                                                                            │
# │ Ordering guarantee (helm upgrade --install --wait):                        │
# │   1. Jaeger sub-chart Deployment  ──► Ready                               │
# │   2. otel-operator Deployment     ──► Ready (webhook available)           │
# │   3. RBAC (ServiceAccount etc.)   ──► Created                             │
# │   4. [hook weight=10] OpenTelemetryCollector CR ──► operator reconciles   │
# │   5. [hook weight=20] Instrumentation CR        ──► operator reconciles   │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Pipeline overview:
#   logs      : filelog → k8sattributes, batch → debug
#   traces    : otlp   → memory_limiter, k8sattributes, batch → debug, otlp/jaeger
#
# When .Values.rcaIngest.enabled is true, two parallel pipelines forward a
# filtered subset to the operator's OTLP ingest endpoint:
#   traces/rca: otlp   → memory_limiter, k8sattributes, filter/errors, batch → otlphttp/rca-operator
#   logs/rca  : filelog → k8sattributes, filter/severity, batch            → otlphttp/rca-operator
# The Jaeger pipeline is left untouched so UI/topology fidelity is preserved.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ include "rca-operator.fullname" . }}-otel
  namespace: {{ include "rca-operator.namespace" . }}
  labels:
    {{- include "rca-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
  annotations:
    # Post-install: runs after the main chart resources are created.
    # Post-upgrade: runs after existing resources are updated.
    # hook-weight=10: applied before the Instrumentation CR (weight=20).
    # before-hook-creation: previous CR is removed before re-applying so
    #   the operator always sees a clean resource during upgrades.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Deployment mode — daemonset ensures one collector pod per node for log tailing.
  mode: {{ .Values.otelCollector.mode }}

  # Collector image (contrib build includes k8sattributes, filelog, and more).
  image: {{ .Values.otelCollector.image }}

  # Use the pre-created SA that has ClusterRole bindings for k8sattributes.
  serviceAccount: {{ include "rca-operator.otelCollectorName" . }}

  resources:
    {{- toYaml .Values.otelCollector.resources | nindent 4 }}

  # Expose OTLP gRPC and HTTP ports so instrumented workloads can send spans.
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  {{- if .Values.otelCollector.filelog.enabled }}
  # Mount the host log directory so the filelog receiver can tail pod logs.
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  {{- end }}

  # ── Collector pipeline config ──────────────────────────────────────────────
  config:
    receivers:
      # OTLP receiver — accepts traces (and optionally metrics) from workloads.
      otlp:
        protocols:
          grpc: {}
          http: {}

      {{- if .Values.otelCollector.filelog.enabled }}
      # Filelog receiver — tails log files written by the container runtime.
      # The `container` operator parses CRI log format and enriches with
      # pod/container metadata extracted from the file path.
      filelog:
        include:
          - /var/log/pods/*/*/*.log
          - /var/log/containers/*.log
        exclude:
          - /var/log/pods/*/kube-system_*/*.log
          - /var/log/pods/*/otc-container/*.log
        start_at: beginning
        include_file_path: true
        include_file_name: true
        poll_interval: 500ms
        operators:
          - type: container
            add_metadata_from_filepath: true
      {{- end }}

    processors:
      # k8sattributes — enriches every span/log with Kubernetes resource metadata
      # (pod name, uid, deployment name, namespace, node name, start time).
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      # Batch processor — buffers telemetry to reduce export round-trips.
      batch:
        send_batch_size: {{ .Values.otelCollector.batch.sendBatchSize }}
        send_batch_max_size: {{ .Values.otelCollector.batch.sendBatchMaxSize }}
        timeout: {{ .Values.otelCollector.batch.timeout }}

      # Memory limiter — sheds load when the collector pod approaches its memory limit.
      memory_limiter:
        check_interval: 1s
        limit_percentage: {{ .Values.otelCollector.memoryLimiter.limitPercentage }}
        spike_limit_percentage: {{ .Values.otelCollector.memoryLimiter.spikeLimitPercentage }}

      {{- if .Values.rcaIngest.enabled }}
      # filter/errors — OTTL-based processor that keeps only spans with
      # STATUS_CODE_ERROR or attributes["http.status_code"] >= httpStatusGte.
      # Used by the RCA-bound traces/rca pipeline so the operator sees only
      # the subset of telemetry it actually correlates on.
      filter/errors:
        error_mode: ignore
        traces:
          span:
            - >-
              not (status.code == STATUS_CODE_ERROR{{ if gt (int .Values.otelIngest.filters.traces.httpStatusGte) 0 }} or attributes["http.status_code"] >= {{ .Values.otelIngest.filters.traces.httpStatusGte }} or attributes["http.response.status_code"] >= {{ .Values.otelIngest.filters.traces.httpStatusGte }}{{ end }})

      # filter/severity — keep only log records with severity >= minSeverity.
      filter/severity:
        error_mode: ignore
        logs:
          log_record:
            - severity_number < SEVERITY_NUMBER_{{ upper .Values.otelIngest.filters.logs.minSeverity }}
      {{- end }}

    exporters:
      # Debug exporter — writes telemetry to the collector's own stdout.
      # Useful for troubleshooting; set verbosity to "basic" in production.
      debug:
        verbosity: {{ .Values.otelCollector.debugVerbosity }}

      # OTLP exporter — forwards traces to Jaeger's OTLP gRPC endpoint.
      # Retry and queue settings make the pipeline resilient to transient Jaeger downtime.
      otlp/jaeger:
        endpoint: {{ include "rca-operator.jaegerOtlpEndpoint" . | quote }}
        tls:
          insecure: true
        retry_on_failure:
          enabled: {{ .Values.otelCollector.exporterRetry.enabled }}
          initial_interval: {{ .Values.otelCollector.exporterRetry.initialInterval }}
          max_interval: {{ .Values.otelCollector.exporterRetry.maxInterval }}
          max_elapsed_time: {{ .Values.otelCollector.exporterRetry.maxElapsedTime }}
        sending_queue:
          enabled: {{ .Values.otelCollector.exporterQueue.enabled }}
          num_consumers: {{ .Values.otelCollector.exporterQueue.numConsumers }}
          queue_size: {{ .Values.otelCollector.exporterQueue.queueSize }}

      {{- if .Values.rcaIngest.enabled }}
      # OTLP/HTTP exporter — forwards the RCA-pipeline subset to the operator's
      # in-process ingest server. The operator re-filters at ingest time and
      # writes matching signals into the shared correlator channel.
      otlphttp/rca-operator:
        endpoint: {{ include "rca-operator.ingestEndpoint" . | quote }}
        # Keep payloads uncompressed for compatibility with lightweight
        # in-operator ingest decoders and easier troubleshooting.
        compression: none
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000
      {{- end }}

    service:
      pipelines:
        {{- if .Values.otelCollector.filelog.enabled }}
        # Logs pipeline: tail files → enrich with k8s metadata → export to stdout.
        logs:
          receivers: [filelog]
          processors: [k8sattributes, batch]
          exporters: [debug]
        {{- if .Values.rcaIngest.enabled }}
        # logs/rca: filtered by severity → forward to operator ingest.
        logs/rca:
          receivers: [filelog]
          processors: [k8sattributes, filter/severity, batch]
          exporters: [otlphttp/rca-operator]
        {{- end }}
        {{- end }}
        # Traces pipeline: receive OTLP → guard memory → enrich → forward to Jaeger.
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [debug, otlp/jaeger]
        {{- if .Values.rcaIngest.enabled }}
        # traces/rca: filtered by error-status → forward to operator ingest.
        traces/rca:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, filter/errors, batch]
          exporters: [otlphttp/rca-operator]
        {{- end }}
{{- end }}
