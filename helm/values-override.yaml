# ── RCA Operator — minimal production override ────────────────────────────────
# Usage:
#   helm dep update ./helm
#   helm upgrade --install rca-operator ./helm \
#     -f helm/values-override.yaml \
#     --namespace rca-system --create-namespace \
#     --wait --timeout 10m
# ─────────────────────────────────────────────────────────────────────────────

# 1. RCA Operator image
image:
  repository: ghcr.io/gaurangkudale/rca-operator
  tag: "0.0.16"

# 2. OpenTelemetry Operator (installs CRDs + webhook for OTelCollector / Instrumentation)
opentelemetryOperator:
  enabled: true

# 3. OTel Collector — DaemonSet, one pod per node
#    Receives traces from apps → enriches with k8s metadata → forwards to Jaeger
otelCollector:
  enabled: true
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.121.0
  # Auto-computed: <release-name>-jaeger:4317
  # Override only if Jaeger runs outside this release:
  # jaegerEndpoint: "my-jaeger.observability.svc.cluster.local:4317"

# 4. Instrumentation CR — zero-code auto-instrumentation via pod annotations
#    targetNamespaces: list every namespace whose apps need auto-instrumentation.
#    A local Instrumentation CR is created in each namespace so that
#    "inject-python/java/nodejs: true" annotations resolve correctly.
instrumentation:
  enabled: true
  targetNamespaces:
    - rca-demo      # ← add your app namespaces here

# 5. Jaeger — all-in-one trace storage + UI
jaeger:
  enabled: true

# RBAC (ServiceAccount, ClusterRole, ClusterRoleBinding for the collector)
# is created automatically by the chart — no override needed.
